<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        // Provide a setter for window.fetch so browser extensions that assign window.fetch do not throw
        try {
          let origFetch = window.fetch ? window.fetch.bind(window) : undefined;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return origFetch;
            },
            set: function(val) {
              origFetch = val;
            }
          });
        } catch (e) {
          // Ignore if property definition is restricted
        }

        // Suppress uncaught errors from browser extensions
        window.addEventListener('error', function(event) {
          if (
            (event.filename && event.filename.indexOf('chrome-extension://') !== -1) ||
            (event.message && event.message.indexOf('Cannot set property fetch') !== -1)
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          if (
            event.reason &&
            event.reason.message &&
            (
              event.reason.message.indexOf('Cannot set property fetch') !== -1 ||
              event.reason.message.indexOf('chrome-extension://') !== -1
            )
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
    <title>Brutalist To-Do</title>
    <meta name="description" content="A high-contrast brutalist to-do list app optimized for desktop and mobile." />
    <meta property="og:title" content="Brutalist To-Do" />
    <meta property="og:description" content="A high-contrast brutalist to-do list app optimized for desktop and mobile." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&family=Space+Grotesk:wght@500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
